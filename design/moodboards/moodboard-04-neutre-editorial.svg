  <text x="40" y="640" font-size="46" font-weight="bold" fill="#1F2328" letter-spacing="-1">Direction v2 — « Neutre éditorial » (retenue)</text>
  <text x="40" y="678" font-size="21" fill="#5C6470">Fond blanc pur, bandes pleine largeur gris clair, coins vifs 2 px, blocs de section</text>
  <text x="40" y="706" font-size="21" fill="#5C6470">bien délimités — et une seule couleur chaude : le rouge, réservé à l'urgent.</text>
