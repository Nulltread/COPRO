  <text x="40" y="640" font-size="46" font-weight="bold" fill="#232B2E" letter-spacing="-1">Direction C — « Ardoise &amp; brume »</text>
  <text x="40" y="678" font-size="21" fill="#55605E">La brume sur la colline : neutre froid, une seule famille de typo,</text>
  <text x="40" y="706" font-size="21" fill="#55605E">bordures nettes, quasi pas d'ombres — la plus épurée des trois.</text>
