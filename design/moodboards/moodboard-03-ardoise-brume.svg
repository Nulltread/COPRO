    <circle cx="880" cy="800" r="44" fill="#8FA98F"/><text x="880" y="874" text-anchor="middle" font-size="20" font-weight="bold" fill="#232B2E">sauge</text><text x="880" y="900" text-anchor="middle" font-size="17" font-family="DejaVu Sans Mono, monospace" fill="#55605E">#8FA98F</text>
