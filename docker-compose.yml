services:
  copro:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - PORT=3000
      - DB_PATH=/app/data/copro.db
      - UPLOAD_DIR=/app/uploads
      # Clés VAPID pour les notifications push (générer avec : npx web-push generate-vapid-keys)
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
    restart: unless-stopped
