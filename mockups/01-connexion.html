<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24466B">
  <title>Connexion — Copro La Pinède de Notre Dame</title>
  <link rel="stylesheet" href="style.css">
  
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Copro">
  <link rel="apple-touch-icon" href="/icon-192.png?v=3">
</head>
<body>

<main class="contenu">

<h1>Connexion</h1>



<form method="post" action="/connexion" class="formulaire">
  <input type="hidden" name="suite" value="/">
  <label>Email
    <input type="email" name="email" required autocomplete="email">
  </label>
  <label>Mot de passe
    <input type="password" name="motdepasse" required autocomplete="current-password">
  </label>
  <button type="submit" class="bouton">Se connecter</button>
</form>
<p><a href="/inscription">Pas encore de compte ? Créer un compte</a></p>
</main>
<div id="modale" class="modale-fond" hidden>
  <div class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-titre">
    <h2 id="modale-titre"></h2>
    <p id="modale-texte"></p>
    <div class="modale-actions">
      <button type="button" id="modale-annuler" class="bouton-secondaire">Annuler</button>
      <button type="button" id="modale-confirmer" class="bouton">Confirmer</button>
    </div>
  </div>
</div>

<div id="overlay-chargement" class="overlay-chargement" hidden><div class="serpent" role="status" aria-label="Chargement…"></div></div>

</body>
</html>
